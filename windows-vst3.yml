name: Build STUTTER LAB VST3 (Windows)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - 'Source/**'
      - 'CMakeLists.txt'
      - '.github/workflows/windows-vst3.yml'

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Configure x64 Release
        run: cmake -S . -B build -A x64 -DCMAKE_BUILD_TYPE=Release

      - name: Build VST3
        run: cmake --build build --config Release --target STUTTER_LAB_VST3 --parallel

      - name: Upload VST3 artifact
        uses: actions/upload-artifact@v4
        with:
          name: STUTTER-LAB-Windows-x64-VST3
          path: build/STUTTER_LAB_artefacts/Release/VST3/STUTTER LAB.vst3
          if-no-files-found: error
          retention-days: 30
